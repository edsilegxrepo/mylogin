name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (${{ matrix.os }} - Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        go: [ '1.22.x', '1.23.x' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit Tests (Linux)
        if: runner.os == 'Linux'
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run Unit Tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v ./...

      - name: Build CLI Binaries
        run: |
          go build -o bin/mylogin ./cmd/mylogin
          go build -o bin/mylogin-dsn ./cmd/mylogin-dsn
          go build -o bin/mylogin-key ./cmd/mylogin-key

  integration:
    name: Live Integration (MySQL 8.4 LTS)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: integration_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Run E2E Integration Tests
        env:
          MYSQL_INTEGRATION_DSN: "root:@tcp(127.0.0.1:3306)/integration_db"
        run: go test -v -tags=integration ./...
